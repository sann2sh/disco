[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "disco-kbd"
version = "1.0.0"
description = "Audio-reactive ASUS TUF F15 keyboard backlight daemon for Linux"
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["asus", "keyboard", "backlight", "audio", "reactive", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = [
    "soundcard>=0.4.2",
    "numpy>=1.22",
]

[project.urls]
Homepage = "https://github.com/sann2sh/disco"
Issues   = "https://github.com/sann2sh/disco/issues"

[project.scripts]
# After `pip install disco-kbd`, you get the `disco` command.
disco = "disco:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["disco*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.service", "*.rules", "*.sh"]
